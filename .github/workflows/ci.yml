
name: TalentForge CI

on:
  push:
    branches:
      - main
      - development
      - 'feature/**'
  pull_request:
    branches:
      - development
      - main

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: node --test tests/*.test.js
      
  backend-api-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: talentforge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talentforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: Backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run API tests
        working-directory: Backend
        env:
          JWT_SECRET_KEY: ci-testing-only-secret
          TEST_DATABASE_URL: postgresql://postgres:ci-test-only@localhost:5432/talentforge_test
        run: python -m pytest tests -v


  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r Backend/requirements.txt
      - run: python -m compileall -q Backend/app

  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          JWT_SECRET_KEY: ci-validation-only-not-for-production
        run: docker compose -f compose.yaml config --quiet
      - name: Validate production configuration
        env:
          DATABASE_URL: postgresql://app:validation-only@db.example:5432/talentforge
          JWT_SECRET_KEY: ci-validation-only-not-for-production
          CORS_ORIGINS: https://frontend.example
          FRONTEND_BASE_URL: https://frontend.example
        run: docker compose -f compose.production.yaml config --quiet

